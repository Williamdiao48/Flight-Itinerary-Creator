<!DOCTYPE html>
<html lang="en">

<head>
    <title>Flight Planner</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="styles.css?v=2">
</head>

<body>
    <h1>Frugal Flyers</h1>
    <div class="main-layout">
        <div class="search-section">
            <div class="preference-section">
                <div class="input-group">
                    <label>Search Preference:</label>
                    <select name="mode" id="mode">
                        <option value="frugal">Frugal (Cheapest)</option>
                        <option value="balanced" selected>Balanced (Price & Speed)</option>
                        <option value="fast">Fast (Quickest Path)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Max Layovers:</label>
                    <select id="max_layovers">
                        <option value="">Any (No Limit)</option>
                        <option value="0">Non-stop only (0)</option>
                        <option value="1">Up to 1 Layover</option>
                        <option value="2">Up to 2 Layovers</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Results to Show:</label>
                    <select id="max_results">
                        <option value="3" selected>Top 3</option>
                        <option value="10">Top 10</option>
                        <option value="100">All Available</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Preferred Airlines (Optional):</label>
                    <input id="preferred_airlines" placeholder="e.g. DL, AA, UA" autocomplete="off">
                </div>
            </div>
            <hr class="divider">
            <div class="search-bubble">
                <div class="input-group autocomplete-container">
                    <label>From: </label>
                    <input id="source" placeholder="Search city or airport..." autocomplete="off">
                    <input type="hidden" id="source_iata">
                    <div id="source-dropdown" class="autocomplete-dropdown" style="display:none;"></div>
                </div>

                <div class="input-group autocomplete-container">
                    <label>To: </label>
                    <input id="destination" placeholder="Search city or airport..." autocomplete="off">
                    <input type="hidden" id="destination_iata">
                    <div id="destination-dropdown" class="autocomplete-dropdown" style="display:none;"></div>
                </div>

                <div class="input-group">
                    <label>Trip Type:</label>
                    <select id="trip_type" onchange="toggleReturnDate()">
                        <option value="one-way" selected>One Way</option>
                        <option value="round-trip">Round Trip</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Departure Date: </label>
                    <input id="departure_date" type="date" min="2024-01-01">
                </div>

                <div class="input-group" id="return_date_group" style="display:none;">
                    <label>Return Date: </label>
                    <input id="return_date" type="date" min="2024-01-01">
                </div>

                <div class="input-group">
                    <label>Departure Window:</label>
                    <select id="departure_window" onchange="toggleCustomWindow()">
                        <option value="anytime" selected>Anytime (All Day)</option>
                        <option value="morning">Morning (4AM - 12PM)</option>
                        <option value="afternoon">Afternoon (12PM - 6PM)</option>
                        <option value="evening">Evening (6PM - 12AM)</option>
                        <option value="custom">Custom Window...</option>
                    </select>
                </div>

                <div class="input-group" id="custom_window_group" style="display:none;">
                    <label>Custom Time Window:</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input id="custom_start_time" type="time" value="08:00">
                        <span>to</span>
                        <input id="custom_end_time" type="time" value="18:00">
                    </div>
                </div>
                <details class="advanced-settings" style="margin-top: 15px; color: #555;">
                    <summary style="cursor: pointer; font-weight: bold;">Advanced Constraints</summary>
                    <div style="margin-top: 10px; padding: 10px; background: #f9f9f9; border-radius: 5px;">
                        <div class="input-group">
                            <label>Max Total Duration (Hours):</label>
                            <input id="max_duration_hours" type="number" value="48" min="1" max="150" style="width: 100%;">
                        </div>
                        <div class="input-group" style="margin-top: 10px;">
                            <label>Max Trip Price ($):</label>
                            <input id="max_price" type="number" value="10000" min="10" step="10" style="width: 100%;">
                        </div>
                    </div>
                </details>
            </div>

            <div class="button-container">
                <button class="plan-button" onclick="planFlight()">Find Flights</button>
            </div>
        </div>
    </div>
    <hr>
    <div class="results-section">
        <div id="loading" style="display:none;">
            <div class="spinner"></div>
            <p>Calculating optimal route...</p>
        </div>
        <div id="map"></div>
        <div id="result"></div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
</body>

</html>
